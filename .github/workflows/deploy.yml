name: Deploy

# Publica a stack na AWS a cada merge em main. A autenticacao usa OIDC: o GitHub
# troca um token de identidade por credenciais temporarias, e nenhuma access key
# fica armazenada no repositorio.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # necessario para o OIDC
  contents: read

concurrency:
  # Evita dois deploys concorrentes atualizando a mesma stack.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build nativo e deploy
    # Runner ARM: as funcoes rodam em Lambda arm64 (Graviton), e o binario nativo
    # e especifico de arquitetura. Compilar em x86_64 geraria um artefato que o
    # Lambda nao consegue executar.
    runs-on: ubuntu-24.04-arm
    # Compilar tres binarios nativos leva ~35 min; somados testes e deploy, 60
    # minutos ficariam no limite.
    timeout-minutes: 90

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A autenticacao vem ANTES da compilacao de proposito: um segredo errado
      # ou uma politica de confianca incorreta falham em segundos, em vez de
      # depois de 40 minutos compilando binarios nativos. A sessao dura 3 horas
      # para cobrir todo o build.
      - name: Assumir a role de deploy via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-deploy
          role-duration-seconds: 10800

      - name: Conferir o acesso a AWS
        # Falha barata que confirma que a role foi assumida de fato.
        run: aws sts get-caller-identity

      - name: Preparar o SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Testes e gate de cobertura
        run: ./mvnw -B --no-transfer-progress verify

      - name: Build nativo das tres funcoes
        # O profile native ja compila em container Mandrel, dispensando o
        # GraalVM instalado no runner.
        run: ./mvnw -B --no-transfer-progress package -Dnative -DskipTests

      - name: Publicar a stack
        working-directory: infra
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "SenderEmail=${{ secrets.SENDER_EMAIL }}" \
              "AdminEmails=${{ secrets.ADMIN_EMAILS }}" \
              "AlertEmail=${{ secrets.ALERT_EMAIL }}"

      - name: Publicar a URL da API no resumo
        if: success()
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name feedback-management \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "### Deploy concluido" >> "$GITHUB_STEP_SUMMARY"
          echo "API disponivel em: $URL" >> "$GITHUB_STEP_SUMMARY"
