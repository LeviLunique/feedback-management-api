# Configuracao exclusiva dos testes do modulo core.
# Nao ha application.properties em src/main/resources de proposito: como este
# modulo e empacotado como dependencia das funcoes, um arquivo na raiz do jar
# colidiria com o application.properties de cada funcao.
quarkus.application.name=feedback-core

app.dynamodb.tabela=feedback
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.devservices.enabled=true

app.sns.topico-feedback-critico=arn:aws:sns:us-east-1:000000000000:feedback-critico
quarkus.sns.aws.region=us-east-1
quarkus.sns.sync-client.type=url
quarkus.sns.devservices.enabled=true

app.ses.remetente=remetente@example.com
app.ses.administradores=admin1@example.com, admin2@example.com
quarkus.ses.aws.region=us-east-1
quarkus.ses.sync-client.type=url
quarkus.ses.devservices.enabled=true

quarkus.log.console.json.enabled=false

quarkus.jacoco.data-file=target/jacoco.exec
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report=false
