quarkus.application.name=urgent-notification-fn

# ---------------------------------------------------------------------------
# Handler acionado pelo topico SNS de feedbacks criticos
# ---------------------------------------------------------------------------
quarkus.lambda.handler=urgentNotification

# ---------------------------------------------------------------------------
# SES: remetente e destinatarios vem do ambiente (nunca versionados)
# ---------------------------------------------------------------------------
app.ses.remetente=${SENDER_EMAIL:no-reply@example.com}
app.ses.administradores=${ADMIN_EMAILS:admin@example.com}
quarkus.ses.aws.region=${AWS_REGION:us-east-1}
quarkus.ses.sync-client.type=url
%prod.quarkus.ses.aws.credentials.type=default

# Esta funcao nao publica no topico, mas compartilha o modulo core que o declara.
app.sns.topico-feedback-critico=${FEEDBACK_CRITICO_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:feedback-critico}
quarkus.sns.aws.region=${AWS_REGION:us-east-1}
quarkus.sns.sync-client.type=url
%prod.quarkus.sns.aws.credentials.type=default

app.dynamodb.tabela=${FEEDBACK_TABLE:feedback}
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}
quarkus.dynamodb.sync-client.type=url
%prod.quarkus.dynamodb.aws.credentials.type=default

# ---------------------------------------------------------------------------
# Logs estruturados para o CloudWatch
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."br.com.fiap.feedback".level=DEBUG
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# ---------------------------------------------------------------------------
# Cobertura de testes (ver comentario no modulo feedback-api)
# ---------------------------------------------------------------------------
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
