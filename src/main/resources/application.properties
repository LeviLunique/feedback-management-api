quarkus.application.name=feedback-management-api

# ---------------------------------------------------------------------------
# HTTP / API
# Os recursos REST declaram o prefixo /api/v1; a raiz permanece em "/" para
# manter os endpoints de gestao (/q/health, /q/openapi) nos caminhos padrao.
# ---------------------------------------------------------------------------
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------------
mp.openapi.extensions.smallrye.info.title=Feedback Management API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Plataforma serverless de feedback de aulas - Tech Challenge FIAP Fase 4
quarkus.swagger-ui.always-include=false

# ---------------------------------------------------------------------------
# Logs
# Em producao (Lambda/CloudWatch) usamos JSON estruturado; em dev/test o
# console legivel facilita o desenvolvimento.
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."br.com.fiap.feedback".level=DEBUG
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# ---------------------------------------------------------------------------
# AWS Lambda (API Gateway HTTP API)
# Em dev/test o mock event server do Quarkus traduz requisicoes HTTP comuns em
# eventos do API Gateway, permitindo usar RestAssured e Newman normalmente.
# Mantido habilitado (default); desabilitar interrompe o poll loop e derruba a
# aplicacao em modo de teste.
# ---------------------------------------------------------------------------
quarkus.lambda.mock-event-server.enabled=true
